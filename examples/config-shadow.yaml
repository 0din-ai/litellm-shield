# litellm-shield — shadow mode (monitor and log, zero client impact)
#
# mode: during_call   — SusFactor runs IN PARALLEL with the LLM call.
#                       The model call is already in-flight; scoring adds
#                       near-zero latency from the client's perspective.
#                       The prompt still reaches the upstream model.
#
# enforcement: shadow — Score every prompt and write to logs.
#                       Never block, never annotate the response.
#                       The client sees no sign the guardrail ran.
#
# Use this when you want to:
#   - Measure real-world false positive rate before enabling enforcement
#   - Collect latency data under production traffic
#   - Validate model accuracy without affecting users
#
# Check logs for: susfactor decision=shadow score=...

model_list:
  - model_name: gpt-4o-mini
    litellm_params:
      model: openrouter/openai/gpt-4o-mini
      api_key: os.environ/OPENROUTER_API_KEY

guardrails:
  - guardrail_name: "susfactor"
    litellm_params:
      guardrail: susfactor_guardrail.SusFactorGuardrail
      mode: "during_call"
      enforcement: "shadow"   # never block — record only
      threshold: 0.5
      fail_open: true
      backend: "sdk-onnx"  # ONNX Runtime — faster on CPU; use sdk for torch path
      # default_on: true applies the guardrail to every request automatically.
      # Without it, callers must include "guardrails": ["susfactor"] in the request body.
      # Recommended for shadow mode: you want to score all traffic, not just
      # requests that explicitly ask for the guardrail.
      default_on: true

litellm_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
