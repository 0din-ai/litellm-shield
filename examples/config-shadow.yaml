# litellm-shield — shadow mode (latency and accuracy validation)
#
# All requests are allowed through. SusFactor scores every prompt but never
# blocks or annotates responses. Use this to:
#   - Measure P50/P95 latency impact under real traffic
#   - Collect ground-truth labels for FPR/TPR analysis
#   - Validate model accuracy before enabling enforcement
#
# Check logs for lines matching: susfactor decision=shadow score=...

model_list:
  - model_name: gpt-4o-mini
    litellm_params:
      model: openrouter/openai/gpt-4o-mini
      api_key: os.environ/OPENROUTER_API_KEY

guardrails:
  - guardrail_name: "susfactor"
    litellm_params:
      guardrail: susfactor_guardrail.SusFactorGuardrail
      mode: "during_call"
      enforcement: "shadow"   # never block — record only
      threshold: 0.5
      fail_open: true
      backend: "sdk-onnx"  # ONNX Runtime — faster on CPU; use sdk for torch path
      # default_on: true applies the guardrail to every request automatically.
      # Without it, callers must include "guardrails": ["susfactor"] in the request body.
      # Recommended for shadow mode: you want to score all traffic, not just
      # requests that explicitly ask for the guardrail.
      default_on: true

litellm_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
