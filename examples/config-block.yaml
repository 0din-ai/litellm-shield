# litellm-shield — block mode (hard enforcement, prompt never reaches the model)
#
# mode: pre_call      — SusFactor runs BEFORE the LLM call is dispatched.
#                       If the prompt is suspicious, the upstream model is
#                       never contacted — the request is rejected immediately.
#                       This guarantees jailbreak prompts never leave your
#                       infrastructure, at the cost of ~16ms added latency
#                       on the critical path (ONNX P50, fully serial).
#
# enforcement: block  — Reject suspicious requests with a 400-level error.
#                       The client receives a guardrail violation message.
#                       Safe prompts pass through normally.
#
# Use this when you want to:
#   - Guarantee jailbreak/injection prompts never reach the upstream model
#   - Meet compliance requirements that prohibit forwarding malicious content
#   - Provide hard SLA guarantees to downstream systems
#
# Recommended: run shadow → flag mode first to validate FPR before blocking.
# Enterprise fail-closed: set fail_open: false to block when the model is
# unavailable (requests blocked rather than allowed through on error).

model_list:
  - model_name: gpt-4o-mini
    litellm_params:
      model: openrouter/openai/gpt-4o-mini
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: gpt-4o
    litellm_params:
      model: openrouter/openai/gpt-4o
      api_key: os.environ/OPENROUTER_API_KEY

guardrails:
  - guardrail_name: "susfactor"
    litellm_params:
      guardrail: litellm_shield.SusFactorGuardrail
      mode: "pre_call"        # block BEFORE the LLM call (never reaches upstream)
      enforcement: "block"
      threshold: 0.5
      fail_open: true         # set false for fail-closed (enterprise) posture
      backend: "sdk-onnx"     # ONNX Runtime — faster on CPU; use sdk for torch path
      scan_output: false      # set true to also reject suspicious model responses
      # default_on: true applies the guardrail to every request automatically.
      # Without it, callers must include "guardrails": ["susfactor"] in the request body.
      # In block mode this is almost always what you want — enforcement should not
      # depend on the caller correctly opting in.
      default_on: true

litellm_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
