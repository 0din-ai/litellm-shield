# litellm-shield — flag mode (recommended for initial POC deployments)
#
# Suspicious requests are ALLOWED through but annotated in logs and tagged
# with an X-SusFactor-Decision response header. Use this to measure real-world
# false positive rate before switching to block mode.
#
# Start: docker compose up
# Or:    litellm --config examples/config-flag.yaml

model_list:
  - model_name: gpt-4o-mini
    litellm_params:
      model: openrouter/openai/gpt-4o-mini
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: gpt-4o
    litellm_params:
      model: openrouter/openai/gpt-4o
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: claude-sonnet
    litellm_params:
      model: openrouter/anthropic/claude-sonnet-4-5
      api_key: os.environ/OPENROUTER_API_KEY

guardrails:
  - guardrail_name: "susfactor"
    litellm_params:
      guardrail: susfactor_guardrail.SusFactorGuardrail
      mode: "during_call"     # runs in parallel with the LLM call — hides latency
      enforcement: "flag"     # allow through, annotate decision
      threshold: 0.5
      fail_open: true         # if model unavailable, allow the request
      # sdk-onnx: ONNX Runtime — ~3-5× faster on CPU, no torch at inference time.
      #           Requires the ONNX model artifact (see scripts/provision_model.py --onnx).
      # sdk:      PyTorch — slower but uses the same weights as the training environment.
      backend: "sdk-onnx"
      scan_output: false      # set true to also score model responses
      # default_on: true applies the guardrail to every request automatically.
      # Without it, callers must include "guardrails": ["susfactor"] in the request body.
      # Set to false (or omit) when you want per-request opt-in, e.g. multi-tenant
      # deployments where only some clients should be scanned.
      default_on: true

litellm_settings:
  # Master key for LiteLLM proxy authentication (clients use this as their Bearer token).
  # The guardrail runs on all requests automatically via default_on: true above.
  master_key: os.environ/LITELLM_MASTER_KEY
