[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "litellm-shield"
version = "0.1.0"
description = "SusFactor jailbreak/prompt-injection guardrail for LiteLLM"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [
    {name = "0DIN Team"},
]
keywords = ["litellm", "guardrail", "jailbreak", "prompt-injection", "susfactor"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "litellm[proxy]>=1.0.0",
    "odin-prompt-toolkit[susfactor,onnx]",
    "httpx>=0.27.0",
]

[tool.uv.sources]
# Wheel is pre-built locally (requires SSH access to the private repo).
# Committed to wheels/ so CI and Docker builds work without credentials.
odin-prompt-toolkit = {path = "wheels/odin_prompt_toolkit-0.5.0-py3-none-any.whl"}

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "mypy>=1.5.0",
]

[project.urls]
Repository = "https://github.com/0din-ai/litellm-shield"

[tool.hatch.build.targets.wheel]
packages = ["susfactor_guardrail"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # Line too long (handled by black)
    "B008",  # Do not perform function call in argument defaults
]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[[tool.mypy.overrides]]
module = [
    "torch",
    "torch.*",
    "transformers",
    "transformers.*",
    "odin_prompt_toolkit",
    "odin_prompt_toolkit.*",
    "litellm",
    "litellm.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
