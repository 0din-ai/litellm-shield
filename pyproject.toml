[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "0din-litellm-shield"
dynamic = ["version"]
description = "SusFactor jailbreak/prompt-injection guardrail for LiteLLM"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    {name = "0DIN Team"},
]
keywords = ["litellm", "guardrail", "jailbreak", "prompt-injection", "susfactor"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "litellm[proxy]>=1.0.0",
    "httpx>=0.27.0",
]

[tool.uv.sources]
# Wheel is pre-built locally (requires SSH access to the private repo).
# Committed to wheels/ so CI and Docker builds work without credentials.
# Only resolved when the self-hosted extra below is installed — the public
# PyPI distribution's core install never touches this.
odin-prompt-toolkit = {path = "wheels/odin_prompt_toolkit-0.5.0-py3-none-any.whl"}

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "mypy>=1.5.0",
]
# 0DIN-internal only: enables SdkBackend/OnnxSdkBackend (in-process inference)
# by pulling in odin-prompt-toolkit. This package is not published to public
# PyPI — it only resolves via the private local wheel pinned in
# [tool.uv.sources] above, which requires `uv` and the committed wheels/
# directory. External users installing `0din-litellm-shield` from PyPI cannot
# resolve this extra; use backend="hosted" instead.
self-hosted = [
    "odin-prompt-toolkit[susfactor,onnx]",
]

[project.urls]
Repository = "https://github.com/0din-ai/litellm-shield"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["litellm_shield"]

[tool.hatch.build.targets.sdist]
# The private odin-prompt-toolkit wheel is committed for internal dev/CI
# builds (see [tool.uv.sources]) but must never ship in the published sdist.
exclude = ["/wheels"]

[tool.black]
line-length = 100
target-version = ["py311", "py312", "py313"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # Line too long (handled by black)
    "B008",  # Do not perform function call in argument defaults
]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[[tool.mypy.overrides]]
module = [
    "torch",
    "torch.*",
    "transformers",
    "transformers.*",
    "odin_prompt_toolkit",
    "odin_prompt_toolkit.*",
    "litellm",
    "litellm.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
